<div class="container">
    <div  style="display: flex; justify-content: space-between;" >
        <div style="display: flex; align-items: center;" >
            <h3 style="margin: 0px;" >
                {{isUpdate ? 'Edit' : 'Show'}}
            </h3>
        </div>
        <button mat-button style="font-size: 24px;" (click)="close()" >X</button>
    </div>
    <mat-divider></mat-divider>

    <div *ngIf="isUpdate" >
        <form [formGroup]="form" style="min-width: 350px; margin-top: 30px;" >
            <div class="container" >
                <div class="row">
                    <mat-form-field>
                        <mat-label>Blog Title</mat-label>
                        <input matInput formControlName="title" >
                    </mat-form-field>
                </div>
                <div class="row">
                    <mat-form-field>
                        <mat-label>Blog Content</mat-label>
                        <textarea matInput formControlName="body" cols="40" rows="10" ></textarea>
                    </mat-form-field>
                </div>
                <button class="mb-2" [disabled]="!form.valid" color="primary" 
                    mat-raised-button (click)="updateText()" >
                    Update</button>
            </div>
        </form>
    </div>

    <div *ngIf="!isUpdate" >
       <div class="container" >
        <div class="row mb-3 mt-2" >
            <div class="col-md-6" >
                <img class="w-100" src="images/image{{imageUrl}}.jpg" />
            </div>
            <div class="col-md-6" >
                <h2> {{title}} </h2>
                <p> {{body}} </p>
            </div>
        </div>
        <div class="row"  *ngFor="let comment of commentData"
            style="padding: 20px; margin-bottom: 20px; background-color:lightgray;" >
                <div class="col-md-2">
                    <img src="images/profile/profile{{comment.userId}}.jpg" 
                    style="width: 30px; height: 30px; border-radius: 50%;" />
                </div>
                <div class="col-md-10">
                    <h3>{{comment.name}}</h3> 
                    <p>{{comment.body}}</p>
            </div>
       </div>
    </div>
</div>
